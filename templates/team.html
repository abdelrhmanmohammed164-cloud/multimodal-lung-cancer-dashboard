{% extends "base.html" %}
{% block content %}

<section class="team-page-shell">
  <div class="team-grid">

    <article class="team-member-card team-member-developer">
      <div class="team-card-accent"></div>
      <div class="team-photo-wrap">
        <div class="team-photo-ring">
          <img class="team-photo team-photo-abdelrhman" src="/static/images/team/team_abdelrhman_refined.jpg" alt="Abdelrhman Mohammed Ibrahim">
        </div>
      </div>
      <div class="team-role-pill"><span class="team-role-icon">&lt;/&gt;</span> DEVELOPER</div>
      <h2 class="team-member-name">Abdelrhman Mohammed<br>Ibrahim</h2>
      <div class="team-divider"><span></span><i>✧</i><span></span></div>
      <div class="team-city-art" aria-hidden="true">
        <img src="/static/images/team/city_alexandria.png" alt="">
      </div>
      <div class="team-location">
        <span class="team-flag">🇪🇬</span>
        <div>
          <strong>EGYPT</strong>
          <small>ALEXANDRIA</small>
        </div>
      </div>
    </article>

    <article class="team-member-card team-member-supervisor">
      <div class="team-card-accent"></div>
      <div class="team-photo-wrap">
        <div class="team-photo-ring">
          <img class="team-photo team-photo-arya" src="/static/images/team/team_arya_refined.jpg" alt="Arya Raj">
        </div>
      </div>
      <div class="team-role-pill"><span class="team-role-icon">●</span> SUPERVISOR</div>
      <h2 class="team-member-name">Arya Raj</h2>
      <div class="team-divider"><span></span><i>✧</i><span></span></div>
      <div class="team-city-art" aria-hidden="true">
        <img src="/static/images/team/city_kerala.png" alt="">
      </div>
      <div class="team-location">
        <span class="team-flag">🇮🇳</span>
        <div>
          <strong>INDIA</strong>
          <small>KERALA</small>
        </div>
      </div>
    </article>

    <article class="team-member-card team-member-supervisor team-member-supervisor-alt">
      <div class="team-card-accent"></div>
      <div class="team-photo-wrap">
        <div class="team-photo-ring">
          <img class="team-photo team-photo-ruchita" src="/static/images/team/team_ruchita.jpg" alt="Ruchita R. Patil">
        </div>
      </div>
      <div class="team-role-pill"><span class="team-role-icon">●</span> SUPERVISOR</div>
      <h2 class="team-member-name">Ruchita R. Patil</h2>
      <div class="team-divider"><span></span><i>✧</i><span></span></div>
      <div class="team-city-art" aria-hidden="true">
        <img src="/static/images/team/city_karnataka.png" alt="">
      </div>
      <div class="team-location">
        <span class="team-flag">🇮🇳</span>
        <div>
          <strong>INDIA</strong>
          <small>KARNATAKA</small>
        </div>
      </div>
    </article>

    <article class="team-member-card team-member-senior">
      <div class="team-card-accent"></div>
      <div class="team-photo-wrap">
        <div class="team-photo-ring">
          <img class="team-photo team-photo-shwetha" src="/static/images/team/team_shwetha.jpg" alt="Dr. Shwetha V.">
        </div>
      </div>
      <div class="team-role-pill"><span class="team-role-icon">★</span> SENIOR ACADEMIC SUPERVISOR</div>
      <h2 class="team-member-name">Dr. Shwetha V.</h2>
      <div class="team-divider"><span></span><i>✧</i><span></span></div>
      <div class="team-city-art" aria-hidden="true">
        <img src="/static/images/team/city_karnataka_senior.png" alt="">
      </div>
      <div class="team-location">
        <span class="team-flag">🇮🇳</span>
        <div>
          <strong>INDIA</strong>
          <small>KARNATAKA</small>
        </div>
      </div>
    </article>

  </div>

  <div class="team-collaboration-strip" aria-label="Egypt and India collaboration">
    <img src="/static/images/team/egypt_india_collaboration.png" alt="Egypt and India — Two Nations, One Vision, Better Health">
  </div>
</section>

{% endblock %}
